<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forrajería Huesito - Tienda Oficial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --brand: #f97316;
            --brand-dim: #ffedd5;
            --brand-dark: #ea580c;
            --accent: #3b82f6;
            --danger: #ef4444;
            --danger-dim: #fee2e2;
            --success: #22c55e;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* Header & Navigation */
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            sticky: top;
            position: sticky;
            top: 0;
            z-index: 40;
            box-shadow: var(--shadow);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .brand-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .admin-trigger {
            background: none;
            border: none;
            color: var(--text-muted);
            opacity: 0.4;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
            padding: 8px;
        }

        .admin-trigger:hover {
            opacity: 1;
            color: var(--brand);
        }

        /* Main Layout */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Search & Filters */
        .controls-section {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media(min-width: 768px) {
            .controls-section {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 500px;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--brand);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--brand);
            color: var(--brand);
        }

        .filter-btn.active {
            background: var(--brand);
            border-color: var(--brand);
            color: var(--surface);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: #f1f5f9;
        }

        .product-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-main);
            box-shadow: var(--shadow);
        }

        .product-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-brand {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            line-height: 1.4;
        }

        .product-actions {
            margin-top: auto;
        }

        .variation-selector {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--bg-primary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            outline: none;
        }

        .price-buy-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--brand-dark);
        }

        .btn-add-cart {
            background: var(--brand);
            color: var(--surface);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add-cart:hover {
            background: var(--brand-dark);
        }

        /* Floating Cart Bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            box-shadow: 0 -10px 25px -5px rgb(0 0 0 / 0.1);
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cart-bar.active {
            transform: translateY(0);
        }

        .cart-bar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-summary-text {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .cart-total {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-checkout {
            background: var(--success);
            color: var(--surface);
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-checkout:hover {
            opacity: 0.9;
        }

        /* Modals & Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--surface);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 10;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-body {
            padding: 1.5rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            background: var(--bg-primary);
        }

        .form-control:focus {
            border-color: var(--brand);
            background: var(--surface);
        }

        .form-row-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            align-items: flex-end;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-primary);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.85rem !important;
        }

        .checkbox-label input {
            accent-color: var(--brand);
        }

        /* Admin Management Lists */
        .admin-section-divider {
            margin: 2rem 0 1rem 0;
            padding-top: 1rem;
            border-top: 2px dashed var(--border);
            font-weight: 700;
            color: var(--brand-dark);
        }

        .variations-list-builder {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        .variation-entry-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
        }

        .btn-remove-var {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: 600;
        }

        /* Cart Rules Alerts */
        .logistic-rule-alert {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: none;
            line-height: 1.4;
        }

        .logistic-rule-alert.danger {
            display: block;
            background-color: var(--danger-dim);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .logistic-rule-alert.info {
            display: block;
            background-color: #e0f2fe;
            color: #0369a1;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        /* Checkout Summary Table */
        .checkout-items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .checkout-items-table th {
            text-align: left;
            padding: 8px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        .checkout-items-table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
        }

        .radio-logistic-option {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .radio-logistic-option:has(input:checked) {
            border-color: var(--brand);
            background-color: var(--brand-dim);
        }

        .radio-logistic-option input[type="radio"] {
            margin-top: 3px;
            accent-color: var(--brand);
        }

        .radio-logistic-option.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--bg-primary);
        }

        .btn-submit-order {
            width: 100%;
            background: var(--success);
            color: var(--surface);
            border: none;
            padding: 1rem;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
        }

        .terms-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 1rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand-info">
                <img id="dom-logo" src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=150&auto=format&fit=crop&q=80" alt="Logo" class="brand-logo">
                <div class="brand-text">
                    <h1 id="dom-name">Forrajería Huesito</h1>
                    <p id="dom-slogan">Alimentos y accesorios con amor para tus mascotas</p>
                </div>
            </div>
            <button class="admin-trigger" onclick="openAdminPanel()">⚙️ Panel</button>
        </div>
    </header>

    <main>
        <section class="controls-section">
            <div class="search-wrapper">
                <input type="text" id="search-input" class="search-input" placeholder="Buscar por nombre o marca..." oninput="handleFilterAndSearch()">
            </div>
            <div class="filter-buttons" id="filter-container">
                <button class="filter-btn active" onclick="setAnimalFilter('todos', this)">Todos</button>
                <button class="filter-btn" onclick="setAnimalFilter('perro', this)">Perros</button>
                <button class="filter-btn" onclick="setAnimalFilter('gato', this)">Gatos</button>
                <button class="filter-btn" onclick="setAnimalFilter('cachorro', this)">Cachorros</button>
            </div>
        </section>

        <section class="products-grid" id="products-container">
            </section>
    </main>

    <div class="cart-bar" id="cart-floating-bar">
        <div class="cart-bar-container">
            <div class="cart-summary-text">
                <span class="cart-count" id="cart-count-text">0 productos seleccionados</span>
                <span class="cart-total" id="cart-total-text">$0.00</span>
            </div>
            <button class="btn-checkout" onclick="openCheckoutModal()">Confirmar Pedido 🐾</button>
        </div>
    </div>

    <div class="modal-overlay" id="admin-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">Panel de Administración Oculto</h3>
                <button class="modal-close" onclick="closeModal('admin-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="admin-settings-form" onsubmit="saveGlobalSettings(event)">
                    <div class="form-group">
                        <label>Nombre del Negocio</label>
                        <input type="text" id="cfg-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Slogan</label>
                        <input type="text" id="cfg-slogan" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>WhatsApp (Código de país + número sin espacios. Ej: 5493431234567)</label>
                        <input type="text" id="cfg-phone" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>URL del Logo de la Tienda</label>
                        <input type="url" id="cfg-logo" class="form-control" required>
                    </div>
                    <button type="submit" class="btn-add-cart" style="background: var
