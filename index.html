<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forrajería Huesito</title>
    <style>
        :root { --primary: #FF9F1C; --secondary: #2EC4B6; --dark: #011627; --light: #F7F7F7; }
        body { font-family: 'Inter', sans-serif; background: var(--light); margin: 0; padding: 0; }
        .header { background: #fff; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .search-box { width: 100%; padding: 12px; border-radius: 20px; border: 1px solid #ddd; background: #eee; margin-top: 10px; box-sizing: border-box; }
        .filter-section { padding: 15px; }
        .filter-group { display: flex; gap: 10px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .chip { padding: 8px 16px; border-radius: 20px; background: #fff; border: 1px solid #ddd; font-size: 0.8rem; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        .catalog { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .product-card { background: #fff; border-radius: 12px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="header">
        <h3>Forrajería Huesito</h3>
        <input type="text" id="search" class="search-box" placeholder="Buscar alimento..." oninput="filter()">
    </div>
    <div class="filter-section">
        <div class="filter-group" id="main-filters">
            <button class="chip active" onclick="selectMain('Todos', this)">Todos</button>
            <button class="chip" onclick="selectMain('Perro', this)">Perro</button>
            <button class="chip" onclick="selectMain('Gato', this)">Gato</button>
            <button class="chip" onclick="selectMain('Aves', this)">Aves</button>
            <button class="chip" onclick="selectMain('Higiene', this)">Higiene</button>
            <button class="chip" onclick="selectMain('Accesorios', this)">Accesorios</button>
        </div>
        <div class="filter-group" id="sub-filters"></div>
    </div><div class="catalog" id="catalog"></div>
    <script>
        const products = [
            { name: "Nutrique Adulto", cat: "Perro", sub: "Adulto", price: "$28.000" },
            { name: "Pro Plan Cachorro", cat: "Perro", sub: "Cachorro", price: "$32.000" },
            { name: "Cat Chow Gatitos", cat: "Gato", sub: "Cachorro", price: "$18.000" },
            { name: "Aves Ponedora", cat: "Aves", sub: "Ponedora", price: "$12.000" },
            { name: "Aves Iniciador", cat: "Aves", sub: "Iniciador", price: "$11.000" },
            { name: "Aves Terminador", cat: "Aves", sub: "Terminador", price: "$10.500" },
            { name: "Piedras Sanitarias", cat: "Higiene", sub: "Piedras", price: "$8.000" },
            { name: "Cama Iglú", cat: "Accesorios", sub: "Camitas", price: "$25.000" },
            { name: "Campera Invierno", cat: "Accesorios", sub: "Ropita", price: "$15.000" }
        ];

        let currentMain = 'Todos';
        let currentSub = 'Todos';function selectMain(cat, btn) {
            document.querySelectorAll('#main-filters .chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            currentMain = cat;
            currentSub = 'Todos';
            const subContainer = document.getElementById('sub-filters');
            subContainer.innerHTML = "";
            const subs = { 'Perro': ['Adulto', 'Cachorro'], 'Gato': ['Adulto', 'Cachorro'], 'Aves': ['Ponedora', 'Iniciador', 'Terminador'], 'Higiene': ['Piedras', 'Limpieza'], 'Accesorios': ['Camitas', 'Ropita'] };
            if (subs[cat]) {
                subs[cat].forEach(s => subContainer.innerHTML += `<button class="chip" onclick="selectSub('${s}', this)">${s}</button>`);
            }
            filter();
        }

        function selectSub(sub, btn) {
            document.querySelectorAll('#sub-filters .chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            currentSub = sub;
            filter();
        }

        function filter() {
            const term = document.getElementById('search').value.toLowerCase();
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = "";
            products.filter(p => (currentMain === 'Todos' || p.cat === currentMain) && (currentSub === 'Todos' || p.sub === currentSub) && p.name.toLowerCase().includes(term))
            .forEach(p => {
                catalog.innerHTML += `<div class="product-card"><div style="font-weight:600">${p.name}</div><div style="color:var(--primary); font-weight:bold">${p.price}</div><button style="width:100%; border:none; background:var(--secondary); color:white; border-radius:5px; margin-top:5px">Agregar</button></div>`;
            });
        }
        filter();
    </script>
</body>
</html>
