<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forrajería Huesito</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff8c00; --bg: #f8f9fa; --text: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 20px; }
        
        /* Header */
        header { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #fff; }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo { width: 45px; height: 45px; background: #ddd; border-radius: 50%; }
        .info h1 { font-size: 1.1rem; } .info p { font-size: 0.7rem; color: #666; }
        
        /* Buscador */
        .search-container { padding: 10px 15px; }
        #search-bar { width: 100%; padding: 10px 20px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        
        /* Banner */
        .banner { background: var(--primary); color: #fff; margin: 15px; padding: 30px; border-radius: 15px; text-align: center; }
        
        /* Filtros */
        .filter-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px; scrollbar-width: none; }
        .chip { background: #fff; padding: 8px 16px; border-radius: 20px; border: 1px solid #ddd; white-space: nowrap; cursor: pointer; }
        .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    </style>
</head>
<body>
    <header>
        <div class="logo-box"><div class="logo"></div><div class="info"><h1>Huesito</h1><p>TIENDA DE MASCOTAS</p></div></div>
        <span>⚙️</span>
    </header>
    <div class="search-container"><input type="text" id="search-bar" placeholder="Buscar productos..."></div>
    <div class="banner"><h2>Todo para tu mejor amigo</h2></div>
    <div class="filter-scroll" id="filters">
        <div class="chip active" data-cat="todos">Todos</div>
        <div class="chip" data-cat="perro">Perro</div>
        <div class="chip" data-cat="gato">Gato</div>
        <div class="chip" data-cat="aves">Aves</div>
        <div class="chip" data-cat="higiene">Higiene</div>
    </div><main id="catalog" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px;">
        <div class="product-card" data-cat="perro">
            <div style="height: 120px; background: #eee; border-radius: 10px; margin-bottom: 8px;"></div>
            <h4>Alimento Premium</h4>
            <p>$15.000</p>
            <button style="width: 100%; padding: 8px; background: var(--primary); color: white; border: none; border-radius: 5px; margin-top: 5px;">Agregar</button>
        </div>
    </main>

    <section style="background: #fff; padding: 20px; margin: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <h3>Sobre nosotros</h3>
        <p style="font-size: 0.9rem; color: #555; margin: 10px 0;">Expertos en nutrición y bienestar animal. Calidad garantizada.</p>
        <a href="https://wa.me/123456789" style="color: var(--primary); font-weight: bold;">WhatsApp: 123-456-789</a>
    </section>

    <footer style="text-align: center; font-size: 0.8rem; color: #999;">© 2026 Forrajería Huesito</footer><script>
    // Filtrado por categoría
    document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            const category = chip.getAttribute('data-cat');
            document.querySelectorAll('.product-card').forEach(card => {
                card.style.display = (category === 'todos' || card.getAttribute('data-cat') === category) ? 'block' : 'none';
            });
        });
    });

    // Buscador en tiempo real
    document.getElementById('search-bar').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.product-card').forEach(card => {
            const title = card.querySelector('h4').innerText.toLowerCase();
            card.style.display = title.includes(term) ? 'block' : 'none';
        });
    });
</script>
</body>
</html>
